name: Build and Release Firmware

on:
  push:
    tags: ["v*"]  # 仅当推送v开头的标签时触发（如v1.0.0）
  workflow_dispatch:  # 支持手动触发

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
          submodules: true
    - name: Write key to file
      run: |
        mkdir -p out
        echo "${{ secrets.MID_KEY_PEM }}" > out/key.pem
        echo "${{ secrets.MID_CERT_PEM }}" > out/cert.pem

    - name: Install QEMU and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libconfuse-dev qemu-user-static make gcc rauc u-boot-tools mtools erofs-utils
        pip install pyelftools
    - name: swap satrt
      run: |
        fallocate -l 2G ./swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: build RK3399-custom
      run: make rk3399-custom

    - name: build H618-k2b
      run: |
        make clean
        make H618-k2b


    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: |
          out/images/haos*.img
          out/images/*.raucb

        retention-days: 7          # 自定义保留天数[7](@ref)
          # 5. 创建GitHub Release并上传镜像
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 自动使用内置Token
      with:
        files: |
          out/images/haos*.img
          out/images/*.raucb
        tag_name: ${{ github.ref_name }}  # 使用触发工作流的标签（如v1.0.0）
        name: "Firmware Release ${{ github.ref_name }}"
        body: "自动化构建的固件镜像，包含以下文件：\n- RK3399-custom镜像\n- H618-k2b镜像"
        draft: false  # 直接发布，非草稿模式