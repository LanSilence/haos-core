name: Build and Release Firmware

on:
  push:
    tags: ["v*"]  # 仅当推送v开头的标签时触发（如v1.0.0）
  workflow_dispatch:  # 支持手动触发

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
          submodules: true
    - name: Write key to file
      run: |
        mkdir -p out
        echo "${{ secrets.MID_KEY_PEM }}" > out/key.pem
        echo "${{ secrets.MID_CERT_PEM }}" > out/cert.pem

    - name: Install QEMU and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libconfuse-dev qemu-user-static make mmdebstrap gcc rauc u-boot-tools mtools erofs-utils
        pip install pyelftools
    - name: swap satrt
      run: |
        sudo fallocate -l 4G ./swapfile
        sudo chmod 600 ./swapfile
        sudo mkswap ./swapfile
        sudo swapon ./swapfile
    - name: Monitor resources
      run: |
        dmesg | tail -20  # 检查内核日志
        free -h        # 查看内存和交换空间使用情况

    - name: build H618-k2b
      run: |
        make clean
        make H618-k2b

    - name: build RK3399-custom
      run: |
        rm -rf ubuntu/binary
        rm -rf ubuntu/ubuntu-24.04-rootfs.img
        rm -rf ubuntu/.ubuntuimg
        make rk3399-custom


    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: |
          out/images/haos*.img
          out/images/*.raucb

        retention-days: 7          # 自定义保留天数[7](@ref)
    - name: Generate Release Notes
      id: release_notes
      run: |
        # 获取当前标签
        CURRENT_TAG="${GITHUB_REF#refs/tags/}"
        
        # 获取上一个标签
        PREV_TAG=$(git describe --abbrev=0 --tags ${CURRENT_TAG}^ 2>/dev/null || echo "")
        
        # 如果没有找到上一个标签，使用初始提交
        if [ -z "${PREV_TAG}" ]; then
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi

        # 生成主项目变更日志（简化转义）
        MAIN_COMMITS=$(git log --pretty=format:"- [主项目] %h %s (by %an)" ${PREV_TAG}..${CURRENT_TAG})
        if [ -z "$MAIN_COMMITS" ]; then
          MAIN_COMMITS="  - 无变更记录"
        fi
        
        # 初始化子模块信息
        SUBMODULE_INFO=""
        
        # 遍历子模块收集变更信息
        git submodule foreach --quiet '
          MODULE_PATH="$path"
          CURRENT_SHA=$(git rev-parse HEAD)
          
          # 获取子模块在PREV_TAG时的commit
          PREV_SHA=$(git rev-list -n 1 "${PREV_TAG}" -- "${MODULE_PATH}" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          # 生成子模块变更日志
          COMMITS=$(git log --pretty=format:"- [子模块] %h %s (by %an)" "${PREV_SHA}".."${CURRENT_SHA}" 2>/dev/null)
          if [ -z "$COMMITS" ]; then
            COMMITS="  - 无变更记录"
          fi
          
          # 格式化子模块信息
          SUBMODULE_INFO="${SUBMODULE_INFO}
          ### 子模块 ${MODULE_PATH}
          - Commit变更: $(echo "${PREV_SHA}" | cut -c1-7) → $(echo "${CURRENT_SHA}" | cut -c1-7)
          ${COMMITS}
          "
        ' || true
        
        # 构建发布说明（不再进行额外转义）
        NOTES="### 版本变更记录 (${CURRENT_TAG} → ${PREV_TAG})
        
        #### 主项目变更
        ${MAIN_COMMITS}
        
        #### 子模块变更
        ${SUBMODULE_INFO}
        
        ### 构建信息
        * 版本: ${CURRENT_TAG}
        * 构建时间: $(date)"

        # 直接输出到环境变量
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: "Haos-core Release ${{ github.ref_name }}"
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false