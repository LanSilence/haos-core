name: Build and Release Firmware

on:
  push:
    tags: ["v*"]  # 仅当推送v开头的标签时触发（如v1.0.0）
    branches: ["master"]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
          submodules: true

    - name: Generate Release Notes
      id: release_notes
      run: |
        CURRENT_TAG="v0.1.9"
        PREV_TAG=$(git describe --abbrev=0 --tags ${CURRENT_TAG}^)
        
        MAIN_COMMITS=$(git log --pretty=format:"- [主项目] %h %s (%an)" ${PREV_TAG}..${CURRENT_TAG})
        
        SUBMODULE_INFO=""
        # 初始化子模块信息变量
        SUBMODULE_INFO=""
        
        # 处理master分支的特殊情况
        if [ "${CURRENT_TAG}" = "master" ]; then
          PREV_TAG=$(git rev-parse HEAD~1)
        fi
        
        # 遍历子模块收集变更信息
        git submodule foreach --quiet '
          MODULE_PATH="$path"
          CURRENT_SHA=$(git rev-parse HEAD)
          
          # 获取子模块在PREV_TAG时的commit
          if [ "${CURRENT_TAG}" = "master" ]; then
            PREV_SHA=$(git rev-parse HEAD~1)
          else
            PREV_SHA=$(git rev-list -n 1 "${PREV_TAG}" -- "${MODULE_PATH}" 2>/dev/null || echo "")
          fi
          
          if [ -z "${PREV_SHA}" ]; then
            # 如果找不到PREV_TAG对应的commit，使用子模块初始commit
            PREV_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          
          # 收集commit历史
          COMMITS=$(git log --pretty=format:"- [子模块] %h %s (%an)" "${CURRENT_SHA}".."${PREV_SHA}" 2>/dev/null || echo "  - 无变更记录")
          
          # 追加到子模块信息
          SUBMODULE_INFO="${SUBMODULE_INFO}
          ### 子模块 ${MODULE_PATH}
          - Commit变更: $(echo "${PREV_SHA}" | cut -c1-7) → $(echo "${CURRENT_SHA}" | cut -c1-7)
          ${COMMITS}
          "
        '

        NOTES="### 版本变更记录 (${CURRENT_TAG} → ${PREV_TAG})\n\n#### 主项目变更\n${MAIN_COMMITS}\n\n#### 子模块变更\n${SUBMODULE_INFO}\n\n### 构建信息\n* 版本: ${CURRENT_TAG}\n* 构建时间: $(date)"
        
        echo "notes=${NOTES}" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: "Haos-core Release ${{ github.ref_name }}"
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false
